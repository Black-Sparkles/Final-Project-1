- name: Create Kubernetes cluster using KOPS
  hosts: kops_admin
  become: yes
  tasks:
    - name: Export ENV variables
      shell: |
        echo "export KOPS_STATE_STORE=s3://kops-cluster-state-store-habib" >> /home/ec2-user/.bashrc
        echo "export AWS_DEFAULT_REGION=us-east-2" >> /home/ec2-user/.bashrc
      args:
        executable: /bin/bash

